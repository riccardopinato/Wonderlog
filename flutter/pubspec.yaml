name: wonderlog
description: "Wonderlog Flutter migration foundation — private, offline-first travel journal."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2
  drift: ^2.30.0
  drift_flutter: ^0.2.6
  sqlite3: ^2.9.4
  uuid: ^4.5.2
  crypto: ^3.0.6
  purchases_flutter: ^10.14.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.5.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: 10.3.10
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  open_filex: ^4.7.0
  share_plus: ^12.0.1
  cross_file: ^0.3.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.30.0

flutter:
  uses-material-design: true
  generate: true
