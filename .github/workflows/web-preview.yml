name: Wonderlog Stable Web Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "flutter/**"
      - ".github/workflows/web-preview.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wonderlog-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate Web platform
        run: |
          set -euo pipefail
          rm -rf web /tmp/wonderlog_web
          flutter create --project-name wonderlog --org com.riccardopinato --platforms=web /tmp/wonderlog_web
          cp -R /tmp/wonderlog_web/web .

      - name: Install and validate
        run: |
          set -euo pipefail
          flutter pub get
          python3 tool/check_release_version.py
          python3 tool/check_localizations.py
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze

      - name: Prepare verified Drift Web runtime
        run: bash tool/prepare_web_runtime.sh

      - name: Build stable Web preview
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_HREF="/${REPO_NAME}/"
          WEB_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define="WONDERLOG_WEB_AUTH_REDIRECT=$WEB_URL" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
          # Reject a deceptively green Flutter build with missing SQLite assets.
          python3 tool/check_web_bundle.py --dist

      - name: Smoke compiled Pages app in headless Chrome
        run: |
          set -euo pipefail
          SITE_ROOT="$(mktemp -d)"
          ln -s "$PWD/build/web" "$SITE_ROOT/Wonderlog"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$SITE_ROOT" > /tmp/wonderlog_pages_http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$SITE_ROOT"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/Wonderlog/; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8765/Wonderlog/
          npm install --prefix /tmp/wonderlog-web-smoke --no-audit --no-fund --no-package-lock --no-save playwright-core@1.57.0
          NODE_PATH=/tmp/wonderlog-web-smoke/node_modules node tool/web_boot_smoke.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: flutter/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
