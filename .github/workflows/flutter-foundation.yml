name: Wonderlog E1 ARM64 APK

on:
  push:
    branches:
      - "build/e1-arm64-apk"
    paths:
      - ".github/workflows/flutter-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wonderlog-e1-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate platform shells
        run: |
          set -euo pipefail
          rm -rf android ios web /tmp/wonderlog_platform
          flutter create --project-name wonderlog --org com.riccardopinato --platforms=android,ios,web /tmp/wonderlog_platform
          cp -R /tmp/wonderlog_platform/android .
          cp -R /tmp/wonderlog_platform/ios .
          cp -R /tmp/wonderlog_platform/web .
          python3 tool/prepare_generated_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android release APKs per ABI
        run: flutter build apk --release --split-per-abi

      - name: Prepare ARM64 artifact
        run: |
          set -euo pipefail
          mkdir -p build/e1-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/e1-arm64/Wonderlog-E1-98d0090-arm64-v8a.apk
          cd build/e1-arm64
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh *.apk
          cat SHA256SUMS.txt

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: wonderlog-e1-98d0090-arm64
          path: |
            flutter/build/e1-arm64/Wonderlog-E1-98d0090-arm64-v8a.apk
            flutter/build/e1-arm64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
