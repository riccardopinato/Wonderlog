name: Wonderlog Flutter Foundation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"
      - "docs/FLUTTER_MIGRATION.md"
  push:
    branches:
      - main
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"

permissions:
  contents: read

concurrency:
  group: wonderlog-flutter-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect legacy donor contract
        run: python3 tool/inspect_legacy_donor.py

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate platform shells
        run: |
          set -euo pipefail
          rm -rf android ios web /tmp/wonderlog_platform
          flutter create --project-name wonderlog --org com.riccardopinato --platforms=android,ios,web /tmp/wonderlog_platform
          cp -R /tmp/wonderlog_platform/android .
          cp -R /tmp/wonderlog_platform/ios .
          cp -R /tmp/wonderlog_platform/web .
          python3 tool/prepare_generated_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release version
        run: python3 tool/check_release_version.py

      - name: Validate localization completeness
        run: python3 tool/check_localizations.py

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web release
        run: flutter build web --release

      - name: Build Android release APKs by ABI
        run: flutter build apk --release --split-per-abi

      - name: Build Android AAB
        run: flutter build appbundle --release

      - name: Prepare verification artifacts
        run: |
          set -euo pipefail
          mkdir -p build/foundation-artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/foundation-artifacts/wonderlog-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/foundation-artifacts/wonderlog-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/foundation-artifacts/wonderlog-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab build/foundation-artifacts/wonderlog.aab
          tar -czf build/foundation-artifacts/wonderlog-web.tar.gz -C build/web .
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          {
            echo "project=Wonderlog"
            echo "version=$VERSION"
            echo "sourceSha=${GITHUB_SHA}"
            echo "variant=release"
            echo "packageId=com.aistudio.wanderlogmemories.pqrzmx"
            echo "workflowRun=${GITHUB_RUN_ID}"
            echo "distributionChannel=GitHub Actions verification artifacts"
            echo "validationLevel=ARTIFACT_BUILT"
            echo "signingMode=CI_DEBUG_KEY_NOT_FOR_STORE"
          } > build/foundation-artifacts/RELEASE_EVIDENCE.txt
          cd build/foundation-artifacts
          sha256sum *.apk *.aab *.tar.gz > SHA256SUMS.txt
          du -h *.apk *.aab *.tar.gz > SIZES.txt

      - name: Upload Android verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wonderlog-flutter-foundation-android
          path: |
            flutter/build/foundation-artifacts/*.apk
            flutter/build/foundation-artifacts/*.aab
            flutter/build/foundation-artifacts/SHA256SUMS.txt
            flutter/build/foundation-artifacts/SIZES.txt
            flutter/build/foundation-artifacts/RELEASE_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Web verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonderlog-flutter-foundation-web
          path: |
            flutter/build/foundation-artifacts/wonderlog-web.tar.gz
            flutter/build/foundation-artifacts/RELEASE_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30
