name: Wonderlog Flutter Foundation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"
      - "docs/FLUTTER_MIGRATION.md"
  push:
    branches:
      - main
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"

permissions:
  contents: read

concurrency:
  group: wonderlog-flutter-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate platform shells
        run: |
          set -euo pipefail
          rm -rf android ios web /tmp/wonderlog_platform
          flutter create --project-name wonderlog --org com.riccardopinato --platforms=android,ios,web /tmp/wonderlog_platform
          cp -R /tmp/wonderlog_platform/android .
          cp -R /tmp/wonderlog_platform/ios .
          cp -R /tmp/wonderlog_platform/web .
          python3 tool/prepare_generated_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web release
        run: flutter build web --release

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Android AAB
        run: flutter build appbundle --release

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p build/foundation-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk build/foundation-artifacts/wonderlog-flutter-foundation.apk
          cp build/app/outputs/bundle/release/app-release.aab build/foundation-artifacts/wonderlog-flutter-foundation.aab
          tar -czf build/foundation-artifacts/wonderlog-web.tar.gz -C build/web .
          cd build/foundation-artifacts
          sha256sum *.apk *.aab *.tar.gz > SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wonderlog-flutter-foundation-android
          path: |
            flutter/build/foundation-artifacts/*.apk
            flutter/build/foundation-artifacts/*.aab
            flutter/build/foundation-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonderlog-flutter-foundation-web
          path: flutter/build/foundation-artifacts/wonderlog-web.tar.gz
          if-no-files-found: error
          retention-days: 30
