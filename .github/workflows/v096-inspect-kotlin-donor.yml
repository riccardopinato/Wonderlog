name: v0.96 Inspect Kotlin donor

on:
  push:
    branches:
      - v096-kotlin-life-bridge
    paths:
      - ".github/workflows/v096-inspect-kotlin-donor.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Extract donor
        run: |
          set -euo pipefail
          rm -rf /tmp/wonderlog-donor
          mkdir -p /tmp/wonderlog-donor
          unzip -q "wanderlog-memories (2).zip" -d /tmp/wonderlog-donor

      - name: Print project structure
        run: |
          set -euo pipefail
          echo "=== ROOT ==="
          find /tmp/wonderlog-donor -maxdepth 3 -type f | sort | head -200
          echo "=== KOTLIN FILES ==="
          find /tmp/wonderlog-donor -type f -name "*.kt" | sort

      - name: Locate domain and UI anchors
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("/tmp/wonderlog-donor")
          needles=[
              "data class Journey","class Journey","data class Trip","class Trip",
              "data class Memory","class Memory","NavHost","NavController",
              "JourneyScreen","TripScreen","MemoryScreen","Share","Clipboard",
              "ACTION_SEND","Intent.createChooser","RoomDatabase","@Entity",
              "build.gradle","AndroidManifest"
          ]
          allowed={".kt",".kts",".xml",".toml",".properties"}
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() not in allowed:
                  continue
              try:
                  text=p.read_text(errors="ignore")
              except Exception:
                  continue
              hits=[]
              lines=text.splitlines()
              for i,line in enumerate(lines,1):
                  if any(n.lower() in line.lower() for n in needles):
                      hits.append((i,line.rstrip()))
              if hits:
                  print(f"\n=== {p.relative_to(root)} ===")
                  for i,line in hits[:120]:
                      print(f"{i}: {line}")
          PY

      - name: Print bridge target source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("/tmp/wonderlog-donor")
          requests={
              "app/src/main/java/com/example/domain/model/Models.kt":[(1,190)],
              "app/src/main/java/com/example/ui/screens/DestinationDetailScreen.kt":[(1,240),(740,860)],
              "app/src/main/java/com/example/ui/screens/MemoryDetailScreen.kt":[(140,235)],
              "app/src/main/java/com/example/presentation/WanderlogViewModel.kt":[(228,330)],
              "app/src/main/AndroidManifest.xml":[(1,120)],
              "app/build.gradle.kts":[(1,220)],
          }
          for rel,ranges in requests.items():
              p=root/rel
              lines=p.read_text(errors="ignore").splitlines()
              print(f"\n===== TARGET {rel} ({len(lines)} lines) =====")
              for start,end in ranges:
                  print(f"--- lines {start}-{end} ---")
                  for i in range(start-1,min(end,len(lines))):
                      print(f"{i+1:04d}: {lines[i]}")
          PY
